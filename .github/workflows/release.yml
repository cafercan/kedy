name: Release

# Push an annotated tag (git tag -a v0.1.5 -m "<notes>") and this publishes the
# release with the zip and SHA256SUMS.txt; the tag message becomes the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag must match manifest version
        run: |
          MANIFEST_VERSION="v$(node -p "require('./manifest.json').version")"
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest $MANIFEST_VERSION"; exit 1
          fi

      - name: Build zip and checksums
        run: bash scripts/package.sh && cat dist/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "Kedy $GITHUB_REF_NAME" --notes-from-tag
