<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kedy - İmleç Takip Eden Kedi Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .info-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      padding: 24px 32px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.6);
      text-align: center;
      max-width: 540px;
      z-index: 10;
    }
    h1 {
      font-size: 24px;
      color: #1e293b;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      text-align: left;
      background: #f8fafc;
      padding: 16px;
      border-radius: 12px;
    }
    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
    }
    .control-item.full {
      grid-column: 1 / -1;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type=range] {
      flex: 1;
      accent-color: #6366f1;
      cursor: pointer;
    }
    input[type=color] {
      width: 100%;
      height: 34px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: #e0e7ff;
      color: #4338ca;
      font-size: 11px;
      font-weight: 600;
    }
    
    /* Kedi Konteyneri */
    #kedy-root {
      position: fixed;
      bottom: 24px;
      right: 40px;
      z-index: 999999;
      pointer-events: auto;
      transform-origin: bottom center;
      cursor: grab;
      user-select: none;
    }
    #kedy-root:active {
      cursor: grabbing;
    }

    .kedy-wrapper {
      position: relative;
      display: inline-block;
    }

    .kedy-svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
      transition: width 0.15s ease, height 0.15s ease;
    }

    /* Kuyruk Salınımı */
    .kedy-tail-wag {
      transform-origin: 154px 82px;
      animation: tailSway 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes tailSway {
      0%, 100% {
        transform: rotate(0deg);
      }
      30% {
        transform: rotate(-7deg);
      }
      70% {
        transform: rotate(9deg);
      }
    }

    /* Göz Kırpma */
    .kedy-eye {
      transform-origin: center;
      transition: transform 0.1s ease;
    }
    .kedy-eye.blinking {
      transform: scaleY(0.08) !important;
    }

    /* Kalp Efekti */
    .kedy-floating-emoji {
      position: absolute;
      font-size: 24px;
      pointer-events: none;
      animation: floatUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      z-index: 100;
    }
    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.5);
      }
      20% {
        opacity: 1;
        transform: translate(0, -15px) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(var(--tx, 0px), -80px) scale(0.9);
      }
    }

    .helper-tip {
      margin-top: 14px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="info-card">
    <h1>🐾 Kedy Canlı Önizleme <span class="badge">v0.1.1</span></h1>
    <p>Fareyi hareket ettirerek kedinin kafasını ve gözlerini yönlendirin. Kediyi istediğiniz yere sürükleyip bırakabilirsiniz!</p>
    
    <div class="controls">
      <div class="control-item full">
        <div class="slider-row">
          <span>Boyut:</span>
          <input type="range" id="sizeRange" min="70" max="320" value="160">
          <span id="sizeVal" style="width: 45px; font-weight: 700; color: #6366f1;">160px</span>
        </div>
      </div>
      
      <div class="control-item">
        <label for="themeSelect">Kedi Cinsi / Teması:</label>
        <select id="themeSelect" style="padding: 6px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 500;">
          <option value="black">Gece Kedisi (Siyah)</option>
          <option value="tuxedo">Smokinli (Tuxedo)</option>
          <option value="orange">Tekir (Sarı/Turuncu)</option>
          <option value="white">Kar Beyazı</option>
          <option value="pink">Pembe Kedi</option>
          <option value="custom">Özel Renk</option>
        </select>
      </div>

      <div class="control-item">
        <label for="colorPicker">Kedi Rengi:</label>
        <input type="color" id="colorPicker" value="#322d35">
      </div>

      <div class="control-item">
        <label for="eyePicker">Göz Rengi:</label>
        <input type="color" id="eyePicker" value="#ffffff">
      </div>

      <div class="control-item">
        <label>
          <input type="checkbox" id="ledgeToggle" checked> Tüneme Çubuğu
        </label>
      </div>

      <div class="control-item">
        <label>
          <input type="checkbox" id="laserToggle"> Lazer Takip Noktası 🔴
        </label>
      </div>
    </div>
    <div class="helper-tip">💡 İpucu: Kediye tıklayarak sevebilir (kalp çıkartabilir) veya sürükleyebilirsiniz.</div>
  </div>

  <!-- Lazer Noktası -->
  <div id="laserDot" style="display:none; position:fixed; width:8px; height:8px; background:#ff0033; border-radius:50%; box-shadow:0 0 12px #ff0033, 0 0 4px #fff; pointer-events:none; z-index:9999999;"></div>

  <!-- Kedi Bileşeni -->
  <div id="kedy-root">
    <div class="kedy-wrapper">
      <svg class="kedy-svg" id="kedySvg" width="160" height="150" viewBox="0 0 200 190" fill="none" xmlns="http://www.w3.org/2000/svg">
        
        <!-- Tüneme Çubuğu (Ledge Bar) -->
        <g id="kedyLedge">
          <rect x="0" y="86" width="200" height="24" rx="12" fill="#E2E8F0" opacity="0.95"/>
        </g>

        <!-- Kuyruk (Tail) -->
        <g class="kedy-tail-wag" id="kedyTailGroup">
          <path id="kedyTail" d="M 152 86 C 166 86 172 110 165 135 C 158 160 138 174 120 166 C 107 160 110 144 122 140 C 133 136 145 146 150 135 C 156 118 152 102 144 86 Z" fill="#322D35"/>
          <path id="kedyTuxedoTailTip" class="kedy-tuxedo-detail" d="M 120 166 C 107 160 110 144 122 140 C 117 148 114 157 120 166 Z" fill="#FFFFFF" style="display:none;"/>
        </g>

        <!-- Gövde (Body) -->
        <g id="kedyBodyGroup">
          <!-- Sırt ve Gövde -->
          <path id="kedyBody" d="M 38 86 C 38 86 42 74 58 64 C 70 56 84 56 94 58 C 112 48 142 49 158 70 C 162 76 160 84 154 86 Z" fill="#322D35"/>
          <path id="kedyTuxedoChest" class="kedy-tuxedo-detail" d="M 44 86 C 45 74 54 64 68 64 C 62 72 58 80 58 86 Z" fill="#FFFFFF" style="display:none;"/>
          
          <!-- Sarkık Ön Pati (Paws hanging over ledge) -->
          <path id="kedyPaw" d="M 38 78 C 33 78 24 81 22 89 C 20 97 24 102 30 102 C 37 102 41 95 42 86 Z" fill="#322D35"/>
          <path id="kedyTuxedoPaw" class="kedy-tuxedo-detail" d="M 22 89 C 20 97 24 102 30 102 C 37 102 41 95 40 88 C 36 90 28 90 22 89 Z" fill="#FFFFFF" style="display:none;"/>
        </g>

        <!-- Kafa Grubu (Head & Ears) -->
        <g id="kedyHeadGroup" style="transform-origin: 58px 58px;">
          <!-- Kafa ve Sivri Kulaklar -->
          <path id="kedyHeadShape" d="
            M 42 42 
            L 34 16 
            L 50 28 
            C 56 24 64 24 70 28 
            L 86 14 
            L 78 40 
            C 90 50 88 70 78 78 
            C 68 86 46 86 36 78 
            C 26 70 28 50 42 42 Z
          " fill="#322D35"/>

          <!-- Smokinli Burun/Çene Beyazlığı (Tuxedo Muzzle) -->
          <path id="kedyTuxedoMuzzle" class="kedy-tuxedo-detail" d="M 52 54 C 54 50 62 50 64 54 C 68 60 62 76 58 76 C 54 76 48 60 52 54 Z" fill="#FFFFFF" style="display:none;"/>

          <!-- Sol Göz -->
          <g id="kedyLeftEyeGroup" class="kedy-eye" style="transform-origin: 47px 52px;">
            <circle cx="47" cy="52" r="6" fill="#FFFFFF" class="kedy-eye-sclera"/>
            <circle id="kedyLeftPupil" cx="47" cy="52" r="3.2" fill="#1C1820" class="kedy-eye-pupil"/>
            <circle cx="45" cy="50" r="1.3" fill="#FFFFFF" opacity="0.9"/>
          </g>

          <!-- Sağ Göz -->
          <g id="kedyRightEyeGroup" class="kedy-eye" style="transform-origin: 69px 48px;">
            <circle cx="69" cy="48" r="6" fill="#FFFFFF" class="kedy-eye-sclera"/>
            <circle id="kedyRightPupil" cx="69" cy="48" r="3.2" fill="#1C1820" class="kedy-eye-pupil"/>
            <circle cx="67" cy="46" r="1.3" fill="#FFFFFF" opacity="0.9"/>
          </g>

          <!-- Sevimli Burun Detayı -->
          <path id="kedyNose" d="M 57 63 L 60 63 L 58.5 65 Z" fill="#58505E" opacity="0.6"/>
        </g>

      </svg>
    </div>
  </div>

  <script>
    const headGroup = document.getElementById('kedyHeadGroup');
    const leftPupil = document.getElementById('kedyLeftPupil');
    const rightPupil = document.getElementById('kedyRightPupil');
    const leftEyeGroup = document.getElementById('kedyLeftEyeGroup');
    const rightEyeGroup = document.getElementById('kedyRightEyeGroup');
    const kedyRoot = document.getElementById('kedy-root');
    const kedySvg = document.getElementById('kedySvg');
    const sizeRange = document.getElementById('sizeRange');
    const sizeVal = document.getElementById('sizeVal');
    const colorPicker = document.getElementById('colorPicker');
    const eyePicker = document.getElementById('eyePicker');
    const ledgeToggle = document.getElementById('ledgeToggle');
    const kedyLedge = document.getElementById('kedyLedge');
    const laserToggle = document.getElementById('laserToggle');
    const laserDot = document.getElementById('laserDot');

    // State
    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 3;
    let curHeadRot = 0;
    let curHeadTx = 0;
    let curHeadTy = 0;

    // Mouse Event
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (laserToggle.checked) {
        laserDot.style.left = (mouseX - 4) + 'px';
        laserDot.style.top = (mouseY - 4) + 'px';
      }
    });

    laserToggle.addEventListener('change', (e) => {
      laserDot.style.display = e.target.checked ? 'block' : 'none';
    });

    // Resize
    function updateSize(val) {
      const w = parseInt(val, 10);
      const h = Math.round(w * 0.95);
      kedySvg.setAttribute('width', w);
      kedySvg.setAttribute('height', h);
      sizeVal.textContent = w + 'px';
    }

    sizeRange.addEventListener('input', (e) => updateSize(e.target.value));

    // Theme & Color
    const themeSelect = document.getElementById('themeSelect');
    const tuxedoDetails = document.querySelectorAll('.kedy-tuxedo-detail');
    const kedyNose = document.getElementById('kedyNose');

    function applyTheme(theme, customColor) {
      const isTuxedo = theme === 'tuxedo';
      let color = customColor || '#322d35';

      if (theme === 'black') color = '#322d35';
      else if (theme === 'tuxedo') color = '#221f26';
      else if (theme === 'orange') color = '#e67e22';
      else if (theme === 'white') color = '#f8fafc';
      else if (theme === 'pink') color = '#ec4899';

      colorPicker.value = color;
      document.getElementById('kedyBody').setAttribute('fill', color);
      document.getElementById('kedyPaw').setAttribute('fill', color);
      document.getElementById('kedyTail').setAttribute('fill', color);
      document.getElementById('kedyHeadShape').setAttribute('fill', color);

      tuxedoDetails.forEach(el => {
        el.style.display = isTuxedo ? 'block' : 'none';
      });

      if (kedyNose) {
        kedyNose.setAttribute('fill', isTuxedo ? '#ff9eaa' : '#58505e');
      }
    }

    themeSelect.addEventListener('change', (e) => {
      applyTheme(e.target.value);
    });

    colorPicker.addEventListener('input', (e) => {
      themeSelect.value = 'custom';
      applyTheme('custom', e.target.value);
    });

    function updateEyeColor(color) {
      document.querySelectorAll('.kedy-eye-sclera').forEach(el => el.setAttribute('fill', color));
    }
    eyePicker.addEventListener('input', (e) => updateEyeColor(e.target.value));

    ledgeToggle.addEventListener('change', (e) => {
      kedyLedge.style.display = e.target.checked ? 'block' : 'none';
    });

    // Click / Pet Heart Reaction & Purr
    const emojis = ['❤️', '✨', '🐾', '😻', '💖', '⭐', '😽'];
    kedyRoot.addEventListener('click', (e) => {
      const heart = document.createElement('div');
      heart.className = 'kedy-floating-emoji';
      heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const rect = kedyRoot.getBoundingClientRect();
      heart.style.left = (e.clientX - rect.left - 12) + 'px';
      heart.style.top = (e.clientY - rect.top - 20) + 'px';
      heart.style.setProperty('--tx', (Math.random() * 50 - 25) + 'px');
      kedyRoot.querySelector('.kedy-wrapper').appendChild(heart);
      setTimeout(() => heart.remove(), 1200);

      // Play soft purr/meow synth sound
      playPurrSound();
      blink();
    });

    function playPurrSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.12);
        osc.frequency.exponentialRampToValueAtTime(320, ctx.currentTime + 0.28);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.32);
      } catch (err) {}
    }

    // Blinking
    function blink() {
      leftEyeGroup.classList.add('blinking');
      rightEyeGroup.classList.add('blinking');
      setTimeout(() => {
        leftEyeGroup.classList.remove('blinking');
        rightEyeGroup.classList.remove('blinking');
      }, 140);
    }

    setInterval(() => {
      if (Math.random() > 0.35) blink();
    }, 3800);

    // Draggable
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    kedyRoot.addEventListener('mousedown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      const rect = kedyRoot.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      let nx = initialLeft + dx;
      let ny = initialTop + dy;
      nx = Math.max(10, Math.min(window.innerWidth - kedyRoot.offsetWidth - 10, nx));
      ny = Math.max(10, Math.min(window.innerHeight - kedyRoot.offsetHeight - 10, ny));
      kedyRoot.style.left = nx + 'px';
      kedyRoot.style.top = ny + 'px';
      kedyRoot.style.right = 'auto';
      kedyRoot.style.bottom = 'auto';
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Main animation loop
    function loop() {
      const headRect = headGroup.getBoundingClientRect();
      const hx = headRect.left + headRect.width / 2;
      const hy = headRect.top + headRect.height / 2;

      const dx = mouseX - hx;
      const dy = mouseY - hy;
      const dist = Math.hypot(dx, dy);

      // Natural head rotation & tilt
      let targetRot = 0;
      if (dx < 0) {
        targetRot = Math.max(-42, Math.min(25, (dy / (Math.abs(dx) + 60)) * 42 - 12));
      } else {
        targetRot = Math.max(-20, Math.min(48, (dy / (Math.abs(dx) + 60)) * 38 + 14));
      }

      // Parallax 3D head offset
      const maxTx = 6;
      const maxTy = 5;
      const targetTx = Math.max(-maxTx, Math.min(maxTx, (dx / (window.innerWidth * 0.5)) * maxTx));
      const targetTy = Math.max(-maxTy, Math.min(maxTy, (dy / (window.innerHeight * 0.5)) * maxTy));

      curHeadRot += (targetRot - curHeadRot) * 0.12;
      curHeadTx += (targetTx - curHeadTx) * 0.12;
      curHeadTy += (targetTy - curHeadTy) * 0.12;

      headGroup.style.transform = `translate(${curHeadTx.toFixed(2)}px, ${curHeadTy.toFixed(2)}px) rotate(${curHeadRot.toFixed(2)}deg)`;

      // Pupil movement
      const maxPupil = 2.4;
      const pupilD = Math.min(maxPupil, dist / 70);
      const angle = Math.atan2(dy, dx);
      const px = Math.cos(angle) * pupilD;
      const py = Math.sin(angle) * pupilD;

      leftPupil.setAttribute('cx', (47 + px).toFixed(2));
      leftPupil.setAttribute('cy', (52 + py).toFixed(2));
      rightPupil.setAttribute('cx', (69 + px).toFixed(2));
      rightPupil.setAttribute('cy', (48 + py).toFixed(2));

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
